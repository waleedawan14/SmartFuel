name: smartfuel_dashboard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  
  pdf: ^3.10.8
  printing: ^5.12.0
  
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.4.4

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
