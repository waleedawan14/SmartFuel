  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Network & Utils
  http: ^1.2.0
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env